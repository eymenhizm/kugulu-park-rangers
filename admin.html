<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>KPR Admin Panel</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
background:#07090b;
color:white;
font-family:Arial;
}

.admin{
max-width:900px;
margin:50px auto;
}

.box{
background:#12161a;
padding:25px;
margin-bottom:20px;
border:1px solid #242a2f;
}

h1,h2{
color:#ff6500;
}

input,textarea,button{
width:100%;
padding:12px;
margin-top:10px;
background:#090b0d;
color:white;
border:1px solid #333;
}

button{
background:#ff6500;
color:black;
font-weight:bold;
cursor:pointer;
}

</style>

</head>


<body>


<div class="admin">


<h1>KPR Yönetim Paneli</h1>


<div class="box">

<h2>Oyuncu Ekle</h2>

<input id="name" placeholder="Oyuncu adı">

<input id="pos" placeholder="Mevki">

<input id="img" placeholder="Fotoğraf yolu">

<button onclick="addPlayer()">
Oyuncu Kaydet
</button>


</div>



<div class="box">

<h2>Eklenen Oyuncular</h2>

<div id="players"></div>

</div>


</div>



<script>


function addPlayer(){

let player={
name:document.getElementById("name").value,
pos:document.getElementById("pos").value,
img:document.getElementById("img").value
};


let players=
JSON.parse(localStorage.getItem("players")) || [];


players.push(player);


localStorage.setItem(
"players",
JSON.stringify(players)
);


loadPlayers();


}



function loadPlayers(){

let box=document.getElementById("players");

box.innerHTML="";


let players=
JSON.parse(localStorage.getItem("players")) || [];


players.forEach(p=>{


box.innerHTML+=`

<div class="box">

<h3>${p.name}</h3>

<p>${p.pos}</p>

<img src="${p.img}" width="150">

</div>


`;


});


}


loadPlayers();


</script>



</body>
</html>
