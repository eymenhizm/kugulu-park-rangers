<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Yönetim | Kuğulu Park Rangers</title>

<link rel="stylesheet" href="css/style.css">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#07090b;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
}


.login-screen{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:
radial-gradient(circle at top,#222,#07090b);
}


.login-box{
width:380px;
background:#12161a;
border:1px solid #252b30;
padding:40px;
}


.login-box img{
width:90px;
display:block;
margin:0 auto 20px;
}


.login-box h1{
text-align:center;
font-size:25px;
margin-bottom:5px;
}


.login-box span{
display:block;
text-align:center;
color:#ff6500;
font-size:11px;
letter-spacing:2px;
margin-bottom:30px;
}


input,select,textarea{

width:100%;
background:#080a0c;
border:1px solid #333;
padding:14px;
color:white;
margin-bottom:15px;

}


button,.btn{

padding:14px 20px;
border:0;
cursor:pointer;
font-weight:bold;

}


.login-btn{

width:100%;
background:#ff6500;
color:#000;

}


.error{

color:#ff6500;
font-size:13px;
text-align:center;
margin-top:15px;

}



/* PANEL */

#panel{
display:none;
}


.admin-head{

height:85px;
border-bottom:1px solid #242a2f;
display:flex;
align-items:center;

}


.container{

width:min(1400px,calc(100% - 60px));
margin:auto;

}


.admin-grid{

display:grid;
grid-template-columns:250px 1fr;
min-height:calc(100vh - 85px);

}


.admin-side{

border-right:1px solid #242a2f;
padding:30px 20px;

}


.admin-side a{

display:block;
padding:15px;
color:#aaa;

}


.admin-side a:hover{

color:#ff6500;

}


.admin-main{

padding:40px;

}


.admin-card{

background:#12161a;
border:1px solid #242a2f;
padding:30px;
margin-bottom:25px;

}


.kicker{

color:#ff6500;
font-size:11px;
letter-spacing:3px;
font-weight:bold;

}


h2{

font-size:45px;
margin:10px 0 30px;

}


.orange{

background:#ff6500;
color:#000;

}


.line{

background:none;
border:1px solid #555;
color:white;

}


.logout{

margin-left:auto;

}



@media(max-width:800px){

.admin-grid{

grid-template-columns:1fr;

}


.admin-side{

display:none;

}


.admin-main{

padding:20px;

}

}

</style>

</head>


<body>



<div class="login-screen" id="login">


<div class="login-box">


<img src="assets/logo/logo.png">


<h1>Kuğulu Park Rangers</h1>

<span>YÖNETİM PANELİ</span>



<input id="username" placeholder="Kullanıcı adı">


<input id="password" type="password" placeholder="Şifre">


<button class="login-btn" onclick="login()">

GİRİŞ YAP

</button>


<div class="error" id="error"></div>


</div>


</div>



<div id="panel">


<header class="admin-head">

<div class="container">

<strong>
KUĞULU PARK RANGERS
</strong>


<button class="line logout" onclick="logout()">
ÇIKIŞ
</button>


</div>

</header>



<div class="admin-grid">


<aside class="admin-side">

<div class="kicker">
YÖNETİM
</div>


<a href="#news">Haberler</a>

<a href="#fixtures">Fikstür</a>

<a href="#players">Oyuncular</a>

<a href="#club">Kulüp</a>

<a href="#data">Yedek</a>


</aside>



<main class="admin-main">
  <section class="admin-card" id="news">

<div class="kicker">HABERLER</div>

<h2>İçerik Yönetimi</h2>

<div id="newsEditor"></div>

<button class="btn orange" id="saveNews">
Haberleri Kaydet
</button>

<button class="btn line" id="addNews">
Haber Ekle
</button>

</section>



<section class="admin-card" id="fixtures">

<div class="kicker">FİKSTÜR</div>

<h2>Maç Takvimi</h2>

<div id="fixtureEditor"></div>

<button class="btn orange" id="saveFixtures">
Fikstürü Kaydet
</button>

<button class="btn line" id="addFixture">
Maç Ekle
</button>

</section>



<section class="admin-card" id="players">

<div class="kicker">KADRO</div>

<h2>Oyuncular</h2>

<div id="playerEditor"></div>

<button class="btn orange" id="savePlayers">
Kadroyu Kaydet
</button>

<button class="btn line" id="addPlayer">
Oyuncu Ekle
</button>

</section>



<section class="admin-card" id="club">

<div class="kicker">KULÜP</div>

<h2>Kulüp Bilgileri</h2>

<div id="clubEditor"></div>


<button class="btn orange" id="saveClub">
Kaydet
</button>


</section>



<section class="admin-card" id="data">

<div class="kicker">
YEDEK / AKTARIM
</div>


<h2>Veri Yönetimi</h2>


<button class="btn line" id="export">
JSON Dışa Aktar
</button>


<label class="btn line">

JSON İçe Aktar

<input 
id="importFile" 
type="file" 
accept=".json"
hidden>

</label>


<button class="btn line" id="reset">
Sıfırla
</button>


</section>


</main>

</div>

</div>



<script src="js/data.js"></script>


<script>


/* LOGIN */

const users={

ergun:"ergun12",

eymen:"eymen12"

};



function login(){


let u=document.getElementById("username").value;

let p=document.getElementById("password").value;


if(users[u]===p){


localStorage.setItem(
"adminLogin",
u
);


document.getElementById("login").style.display="none";

document.getElementById("panel").style.display="block";


}

else{


document.getElementById("error").innerHTML=
"Bilgiler hatalı";


}


}



function logout(){

localStorage.removeItem("adminLogin");

location.reload();

}



if(localStorage.getItem("adminLogin")){

document.getElementById("login").style.display="none";

document.getElementById("panel").style.display="block";

}



/* VERİ SİSTEMİ */


const KEY="kuğulu_park_rangers_admin_data";


let D=(()=>{


try{

return JSON.parse(localStorage.getItem(KEY))
||
structuredClone(window.KUGULU_DATA);

}

catch{

return structuredClone(window.KUGULU_DATA);

}


})();



function save(){

localStorage.setItem(
KEY,
JSON.stringify(D)
);


alert("Kaydedildi");

}




function esc(x){

return String(x||"")
.replace(/"/g,"&quot;");

}




function render(){



document.getElementById("newsEditor").innerHTML=

D.news.map((n,i)=>`

<div class="admin-card">

<input 
data-news="${i}"
data-key="title"
value="${esc(n.title)}">

<input
data-news="${i}"
data-key="date"
value="${esc(n.date)}">

</div>

`).join("");





document.getElementById("playerEditor").innerHTML=

D.players.map((p,i)=>`

<div class="admin-card">


<input
data-player="${i}"
data-key="name"
value="${esc(p.name)}">


<input
data-player="${i}"
data-key="position"
value="${esc(p.position)}">


<input
data-player="${i}"
data-key="image"
value="${esc(p.image)}">


</div>

`).join("");





document.getElementById("fixtureEditor").innerHTML=

D.fixtures.map((f,i)=>`

<div class="admin-card">


<input
data-fixture="${i}"
data-key="home"
value="${esc(f.home)}">


<input
data-fixture="${i}"
data-key="away"
value="${esc(f.away)}">


<input
data-fixture="${i}"
data-key="time"
value="${esc(f.time)}">


</div>


`).join("");



}




render();



document.getElementById("savePlayers").onclick=()=>{

document.querySelectorAll("[data-player]")
.forEach(e=>{

D.players[e.dataset.player]
[e.dataset.key]=e.value;

});


save();

};



document.getElementById("saveNews").onclick=()=>{

document.querySelectorAll("[data-news]")
.forEach(e=>{

D.news[e.dataset.news]
[e.dataset.key]=e.value;

});


save();

};



document.getElementById("saveFixtures").onclick=()=>{

document.querySelectorAll("[data-fixture]")
.forEach(e=>{

D.fixtures[e.dataset.fixture]
[e.dataset.key]=e.value;

});


save();

};



document.getElementById("addPlayer").onclick=()=>{

D.players.push({

number:"00",

name:"Yeni Oyuncu",

position:"Forvet",

image:"assets/players/yeni.png"

});


render();

};



document.getElementById("addNews").onclick=()=>{

D.news.unshift({

title:"Yeni Haber",

date:"08 Ağustos 2026",

tag:"Kulüp"

});


render();

};



document.getElementById("addFixture").onclick=()=>{


D.fixtures.push({

home:"Kuğulu Park Rangers",

away:"Rakip",

time:"19:00"

});


render();

};





document.getElementById("saveClub").onclick=()=>{

save();

};




document.getElementById("export").onclick=()=>{


let a=document.createElement("a");

a.href=URL.createObjectURL(

new Blob(
[JSON.stringify(D,null,2)],
{type:"application/json"}

)

);


a.download="kpr-yedek.json";

a.click();


};




document.getElementById("reset").onclick=()=>{

localStorage.removeItem(KEY);

location.reload();

};





</script>


</body>

</html>
